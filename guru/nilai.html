<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Nilai - EduAdaptif</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .table-responsive { max-height: 500px; overflow-y: auto; }
    th { position: sticky; top: 0; background: #f8f9fa !important; z-index: 10; text-align: center; }
    .input-nilai { width: 65px; text-align: center; margin: 0 auto; }
  </style>
</head>
<body class="p-3 bg-light">

  <div class="container-fluid bg-white p-4 rounded shadow-sm">
    <h4 class="mb-3 text-primary">Input Nilai Siswa</h4>
    
    <!-- FILTER -->
    <div class="row g-3 mb-3">
      <div class="col-md-4">
        <label class="form-label font-weight-bold">Kelas</label>
        <select id="select-kelas" class="form-select" onchange="loadNilai()">
          <option value="">-- Pilih Kelas --</option>
          <option value="XI-5">XI-5</option>
          <!-- Tambahkan opsi kelas lainnya jika ada -->
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label font-weight-bold">Mata Pelajaran</label>
        <select id="select-mapel" class="form-select" onchange="loadNilai()">
          <option value="">-- Pilih Mapel --</option>
          <option value="Informatika">Informatika</option>
          <!-- Tambahkan opsi mapel lainnya jika ada -->
        </select>
      </div>
      <div class="col-md-4 d-flex align-items-end">
        <button id="btn-simpan" class="btn btn-success w-100" onclick="simpanNilai()">
          <i class="bi bi-save"></i> Simpan Semua Nilai
        </button>
      </div>
    </div>

    <!-- TABEL INPUT NILAI HORIZONTAL -->
    <div class="table-responsive border rounded">
      <table class="table table-bordered table-hover align-middle mb-0">
        <thead>
          <tr>
            <th style="width: 40px;">No</th>
            <th style="min-width: 220px; text-align: left;">Nama Siswa</th>
            <th>NH1</th>
            <th>NH2</th>
            <th>NH3</th>
            <th>NH4</th>
            <th>T1</th>
            <th>T2</th>
            <th>T3</th>
            <th>T4</th>
            <th>STS1</th>
            <th>STS2</th>
            <th>SAS1</th>
            <th>SAS2</th>
          </tr>
        </thead>
        <tbody id="tbody-nilai">
          <tr>
            <td colspan="14" class="text-center text-muted">Pilih Kelas dan Mata Pelajaran untuk menampilkan data.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // SESUAIKAN URL DEPLOYMENT ANDA DI SINI
    const API_URL_APP = "https://script.google.com/macros/s/AKfycby79vQf4Jomh_h3jd5KsVBcgxVDPhim2YeOWS4aKOqGG-pBI-yX0u1ZwxOTYJWhg9dO/exec"; 

    // Kolom-kolom nilai horizontal
    const KOLOM_NILAI = ['nh1', 'nh2', 'nh3', 'nh4', 'tugas1', 'tugas2', 'tugas3', 'tugas4', 'sts1', 'sts2', 'sas1', 'sas2'];

    // 1. Memuat Data Nilai
    function loadNilai() {
      const kelas = document.getElementById("select-kelas").value;
      const mapel = document.getElementById("select-mapel").value;

      if (!kelas || !mapel) return;

      const tbody = document.getElementById("tbody-nilai");
      tbody.innerHTML = `<tr><td colspan="14" class="text-center py-4">Memuat data nilai...</td></tr>`;

      fetch(API_URL_APP, {
        method: "POST",
        body: JSON.stringify({
          action: "getNilai",
          kelas: kelas,
          mapel: mapel
        })
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === "success") {
          renderTabelNilai(res.data);
        } else {
          alert("Gagal memuat data: " + res.message);
        }
      })
      .catch(err => {
        tbody.innerHTML = `<tr><td colspan="14" class="text-center text-danger py-4">Gagal terhubung ke server.</td></tr>`;
      });
    }

    // 2. Render Tabel
    function renderTabelNilai(dataNilai) {
      const tbody = document.getElementById("tbody-nilai");
      tbody.innerHTML = "";

      if (!dataNilai || dataNilai.length === 0) {
        tbody.innerHTML = `<tr><td colspan="14" class="text-center text-muted py-4">Tidak ada data siswa untuk kelas ini.</td></tr>`;
        return;
      }

      dataNilai.forEach((item, index) => {
        let tr = document.createElement("tr");
        tr.setAttribute("data-nama", item.nama_siswa);

        let htmlInputs = `
          <td class="text-center">${index + 1}</td>
          <td class="fw-bold">${item.nama_siswa}</td>
        `;

        KOLOM_NILAI.forEach(kol => {
          let val = item[kol] !== undefined && item[kol] !== null ? item[kol] : "";
          htmlInputs += `
            <td>
              <input type="number" 
                     class="form-control input-nilai input-${kol}" 
                     data-kolom="${kol}" 
                     value="${val}">
            </td>
          `;
        });

        tr.innerHTML = htmlInputs;
        tbody.appendChild(tr);
      });
    }

    // 3. Simpan Nilai Horizontal
    function simpanNilai() {
      const kelas = document.getElementById("select-kelas").value;
      const mapel = document.getElementById("select-mapel").value;
      const btnSimpan = document.getElementById("btn-simpan");

      if (!kelas || !mapel) {
        alert("Pilih Kelas dan Mapel terlebih dahulu!");
        return;
      }

      const rows = document.querySelectorAll("#tbody-nilai tr");
      const listNilai = [];

      rows.forEach(tr => {
        const namaSiswa = tr.getAttribute("data-nama");
        if (!namaSiswa) return;

        let rowObj = { nama_siswa: namaSiswa };

        tr.querySelectorAll(".input-nilai").forEach(input => {
          const fieldName = input.getAttribute("data-kolom");
          rowObj[fieldName] = input.value !== "" ? Number(input.value) : "";
        });

        listNilai.push(rowObj);
      });

      btnSimpan.disabled = true;
      btnSimpan.innerText = "Menyimpan...";

      fetch(API_URL_APP, {
        method: "POST",
        body: JSON.stringify({
          action: "saveNilai",
          kelas: kelas,
          mapel: mapel,
          nilai: listNilai
        })
      })
      .then(res => res.json())
      .then(res => {
        btnSimpan.disabled = false;
        btnSimpan.innerHTML = `<i class="bi bi-save"></i> Simpan Semua Nilai`;
        alert(res.message);
        if (res.status === "success") {
          loadNilai(); // Refresh data
        }
      })
      .catch(err => {
        btnSimpan.disabled = false;
        btnSimpan.innerHTML = `<i class="bi bi-save"></i> Simpan Semua Nilai`;
        alert("Terjadi kesalahan saat menyimpan: " + err);
      });
    }
  </script>
</body>
</html>
