<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduAdaptif - Rekapitulasi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Panggil file konfigurasi global -->
    <script src="config.js"></script>

    <style>
        :root { 
            --primary-dark: #1e293b; 
            --nav-blue: #2c3e50; 
            --accent-blue: #3498db; 
            --bg-light: #f1f5f9; 
            --white: #ffffff; 
            --secondary-dark: #0f172a; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg-light); display: flex; flex-direction: column; min-height: 100vh; color: #334155; }
        .main-wrapper { display: flex; flex: 1; flex-direction: column; }
        .top-header { background-color: var(--primary-dark); color: var(--white); text-align: center; padding: 15px 10px; z-index: 100; }
        .profile-pic { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-blue); margin: 0 auto 5px; display: block; }
        .top-header h1 { font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
        .nav-bar { background-color: var(--nav-blue); display: flex; flex-wrap: wrap; width: 100%; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .nav-bar a { flex: 1; text-align: center; color: #cbd5e1; padding: 12px 5px; text-decoration: none; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-bar a.active { border-bottom: 3px solid var(--accent-blue); background-color: rgba(255,255,255,0.05); color: #fff; }
        .btn-logout-top { width: 100%; background-color: #c0392b; text-align: center; color: var(--white); padding: 10px; text-decoration: none; font-size: 13px; font-weight: 600; display: block; border: none; cursor: pointer; }
        .content-area { flex: 1; padding: 15px; width: 100%; }
        .card { background: var(--white); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        .filter-card { background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        .form-grid { display: flex; flex-direction: column; gap: 12px; }
        select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
        
        .tab-btn-group { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .tab-btn { padding: 10px 18px; border: none; background: #e2e8f0; color: #475569; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .tab-btn.active { background: var(--accent-blue); color: #fff; }

        .table-responsive { width: 100%; overflow-x: auto; border: 1px solid #e2e8f0; border-radius: 8px; background: var(--white); }
        table { width: 100%; border-collapse: collapse; }
        table th { background-color: #f8fafc; color: #64748b; font-weight: 700; text-align: center; padding: 10px; font-size: 12px; border: 1px solid #e2e8f0; }
        table td { padding: 8px 10px; border: 1px solid #e2e8f0; font-size: 12px; }
        .txt-center { text-align: center; } 
        .txt-bold { font-weight: bold; }

        .badge-present { background: #dcfce7; color: #15803d; padding: 3px 8px; border-radius: 12px; font-weight: bold; }
        .btn-print { background: #8e44ad; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; float: right; margin-bottom: 15px; }

        footer { background-color: var(--secondary-dark); color: #94a3b8; text-align: center; padding: 20px; font-size: 12px; margin-top: auto; }

        @media (min-width: 769px) {
            .main-wrapper { flex-direction: row; }
            .top-header { width: 260px; min-height: 100vh; position: sticky; top: 0; padding-top: 40px; }
            .profile-pic { width: 90px; height: 90px; margin-bottom: 15px; }
            .nav-bar { flex-direction: column; background: none; box-shadow: none; margin-top: 25px; }
            .nav-bar a { width: 100%; text-align: left; padding: 15px 25px; flex-direction: row; gap: 12px; font-size: 15px; }
            .nav-bar a.active { border-left: 4px solid var(--accent-blue); background-color: #34495e; border-bottom: none; }
            .btn-logout-top { position: absolute; bottom: 0; left: 0; padding: 15px; }
            .content-area { padding: 30px; max-width: calc(100% - 260px); }
            .form-grid { flex-direction: row; }
        }

        /* Styling Khusus Cetak/Print */
        @media print {
            .top-header, .nav-bar, .btn-logout-top, .filter-card, .tab-btn-group, .btn-print, footer { display: none !important; }
            body, .main-wrapper, .content-area, .card { background: #fff !important; padding: 0 !important; margin: 0 !important; box-shadow: none !important; width: 100% !important; max-width: 100% !important; }
            .table-responsive { border: none !important; }
            table th, table td { border: 1px solid #000 !important; color: #000 !important; }
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <!-- Header Left / Sidebar -->
    <div class="top-header">
        <img id="user-pic" src="photo-guru.png" class="profile-pic" alt="User" onerror="this.src='https://via.placeholder.com/80?text=GURU'">
        <h1>EduAdaptif</h1>
        <p id="user-name" style="font-size:12px; color:#cbd5e1; font-weight:600; margin-top:5px;">Loading...</p>
        <br/>
        <div class="nav-bar">
            <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="presensi.html"><i class="fas fa-clipboard-user"></i> Presensi Siswa</a>
            <a href="jurnal.html"><i class="fas fa-book-open"></i> Jurnal Mengajar</a>
            <a href="nilai.html"><i class="fas fa-graduation-cap"></i> Input Nilai</a>
            <a href="rekap.html" class="active"><i class="fas fa-file-invoice"></i> Rekapitulasi</a>
        </div>
        <button onclick="logout()" class="btn-logout-top"><i class="fas fa-sign-out-alt"></i> Keluar</button>
    </div>

    <!-- Content Area -->
    <div class="content-area">
        <div class="card">
            <h2>Laporan Rekapitulasi Pembelajaran — <span id="lbl-mapel" style="color:var(--accent-blue);"></span></h2>
            
            <div class="filter-card" style="margin-top:15px;">
                <div class="form-grid">
                    <div style="flex: 1;">
                        <label style="font-weight:600; display:block; margin-bottom:5px;">Pilih Kelas:</label>
                        <select id="sel-kelas" onchange="onKelasChange()"></select>
                    </div>
                </div>
            </div>

            <!-- Tab Tampilan Rekap -->
            <div class="tab-btn-group">
                <button class="tab-btn active" id="tab-presensi" onclick="switchTab('presensi')"><i class="fas fa-user-check"></i> Rekap Presensi</button>
                <button class="tab-btn" id="tab-nilai" onclick="switchTab('nilai')"><i class="fas fa-poll"></i> Rekap Nilai</button>
            </div>

            <button onclick="window.print()" class="btn-print"><i class="fas fa-print"></i> Cetak Laporan</button>
            <div style="clear:both;"></div>

            <!-- Container Tabel Data Rekap -->
            <div id="rekap-container">Memuat rekapitulasi...</div>
        </div>
    </div>
</div>

<footer>&copy; 2026 <strong>EduAdaptif</strong> | Created by usudo.id</footer>

<script>
    const API_URL_APP = typeof window.API_URL !== 'undefined' ? window.API_URL : (window.CONFIG ? window.CONFIG.SCRIPT_URL : '');
    const userSession = JSON.parse(localStorage.getItem('user_session'));
    const activeMapel = localStorage.getItem('active_mapel') || (userSession ? userSession.mapel : "");
    const activeKelas = localStorage.getItem('active_kelas') || "";

    if (!userSession) window.location.href = 'index.html';

    document.getElementById('user-name').innerText = userSession.nama || userSession.username || "Guru";
    document.getElementById('lbl-mapel').innerText = activeMapel || "Belum Dipilih";
    if (userSession.foto) document.getElementById('user-pic').src = userSession.foto;

    const selKelas = document.getElementById('sel-kelas');
    let currentTab = 'presensi';

    populateKelasOptions();

    function cleanTextJS(str) {
        return String(str || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function populateKelasOptions() {
        const setKelas = new Set();

        if (userSession.penugasan && Array.isArray(userSession.penugasan)) {
            userSession.penugasan.forEach(p => {
                if (!activeMapel || String(p.mapel).trim().toLowerCase() === activeMapel.trim().toLowerCase()) {
                    if (p.kelas) {
                        String(p.kelas).split(',').forEach(k => {
                            if (k.trim() !== "") setKelas.add(k.trim());
                        });
                    }
                }
            });
        }

        if (setKelas.size === 0 && userSession.ampu_kelas) {
            String(userSession.ampu_kelas).split(',').forEach(k => {
                if (k.trim() !== "") setKelas.add(k.trim());
            });
        }

        const listKelas = Array.from(setKelas);

        if (listKelas.length === 0) {
            selKelas.innerHTML = '<option value="">-- Tidak Ada Kelas Terdaftar --</option>';
            return;
        }

        selKelas.innerHTML = listKelas.map(k => `<option value="${k}">${k}</option>`).join('');

        if (activeKelas && listKelas.includes(activeKelas)) {
            selKelas.value = activeKelas;
        }
    }

    function onKelasChange() {
        localStorage.setItem('active_kelas', selKelas.value);
        loadRekapData();
    }

    function switchTab(type) {
        currentTab = type;
        document.getElementById('tab-presensi').classList.toggle('active', type === 'presensi');
        document.getElementById('tab-nilai').classList.toggle('active', type === 'nilai');
        loadRekapData();
    }

    function logout() {
        localStorage.clear();
        window.location.href = 'index.html';
    }

    async function loadRekapData() {
        const kls = selKelas.value;
        const container = document.getElementById('rekap-container');

        if (!kls) {
            container.innerHTML = `<div style="text-align:center; padding:30px; color:#94a3b8;">Silakan pilih kelas terlebih dahulu.</div>`;
            return;
        }

        container.innerHTML = `<div style="text-align:center; padding:30px; color:#64748b;"><i class="fas fa-spinner fa-spin"></i> Mengomputasi data rekapitulasi...</div>`;

        try {
            if (currentTab === 'presensi') {
                await renderRekapPresensi(kls, container);
            } else {
                await renderRekapNilai(kls, container);
            }
        } catch (err) {
            container.innerHTML = `<div style="color:#ef4444; padding:20px; text-align:center;">Gagal memuat rekapitulasi dari database.</div>`;
        }
    }

    // 1. RENDER TABEL REKAP PRESENSI
    async function renderRekapPresensi(kls, container) {
        const [resSiswa, resPres] = await Promise.all([
            fetch(`${API_URL_APP}?action=getSiswa`).then(r => r.json()),
            fetch(`${API_URL_APP}?action=getPresensi&kelas=${encodeURIComponent(kls)}&mapel=${encodeURIComponent(activeMapel)}&tipe=all`).then(r => r.json())
        ]);

        const targetKlsNormalized = cleanTextJS(kls);
        const siswaList = resSiswa.data ? resSiswa.data.filter(s => cleanTextJS(s.kelas) === targetKlsNormalized) : [];
        const presData = resPres.data || {};

        if (siswaList.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:30px; color:#94a3b8;">Tidak ada data siswa.</div>`;
            return;
        }

        let html = `
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th width="40">No</th>
                            <th>Nama Lengkap Siswa</th>
                            <th width="60">Hadir (H)</th>
                            <th width="60">Sakit (S)</th>
                            <th width="60">Izin (I)</th>
                            <th width="60">Alpha (A)</th>
                            <th width="100">% Kehadiran</th>
                        </tr>
                    </thead>
                    <tbody>`;

        siswaList.forEach((s, idx) => {
            const namaClean = String(s.nama).trim();
            const namaKey = cleanTextJS(namaClean);
            const stat = presData[namaKey] || { H: 0, S: 0, I: 0, A: 0 };
            
            const totalPertemuan = (stat.H || 0) + (stat.S || 0) + (stat.I || 0) + (stat.A || 0);
            const persen = totalPertemuan > 0 ? Math.round(((stat.H || 0) / totalPertemuan) * 100) : 0;

            html += `
                <tr>
                    <td class="txt-center">${idx + 1}</td>
                    <td class="txt-bold">${namaClean}</td>
                    <td class="txt-center" style="color:#10b981; font-weight:bold;">${stat.H || 0}</td>
                    <td class="txt-center" style="color:#f59e0b;">${stat.S || 0}</td>
                    <td class="txt-center" style="color:#3b82f6;">${stat.I || 0}</td>
                    <td class="txt-center" style="color:#ef4444; font-weight:bold;">${stat.A || 0}</td>
                    <td class="txt-center"><span class="badge-present">${persen}%</span></td>
                </tr>`;
        });

        html += `</tbody></table></div>`;
        container.innerHTML = html;
    }

    // 2. RENDER TABEL REKAP NILAI
    async function renderRekapNilai(kls, container) {
        const [resSiswa, resNilai] = await Promise.all([
            fetch(`${API_URL_APP}?action=getSiswa`).then(r => r.json()),
            fetch(`${API_URL_APP}?action=getNilai&kelas=${encodeURIComponent(kls)}&mapel=${encodeURIComponent(activeMapel)}`).then(r => r.json())
        ]);

        const targetKlsNormalized = cleanTextJS(kls);
        const siswaList = resSiswa.data ? resSiswa.data.filter(s => cleanTextJS(s.kelas) === targetKlsNormalized) : [];
        const nilaiData = resNilai.data || {};

        if (siswaList.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:30px; color:#94a3b8;">Tidak ada data siswa.</div>`;
            return;
        }

        let html = `
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th width="40">No</th>
                            <th>Nama Lengkap Siswa</th>
                            <th width="70">NH1</th>
                            <th width="70">NH2</th>
                            <th width="70">STS</th>
                            <th width="70">SAS</th>
                            <th width="90">Rata-Rata</th>
                        </tr>
                    </thead>
                    <tbody>`;

        siswaList.forEach((s, idx) => {
            const namaClean = String(s.nama).trim();
            const namaKey = cleanTextJS(namaClean);
            const userScores = nilaiData[namaKey] || {};

            const nh1 = userScores['nh1'] || 0;
            const nh2 = userScores['nh2'] || 0;
            const sts = userScores['sts1'] || userScores['sts2'] || 0;
            const sas = userScores['sas1'] || userScores['sas2'] || 0;

            const total = nh1 + nh2 + sts + sas;
            const avg = total > 0 ? (total / 4).toFixed(1) : "0.0";

            html += `
                <tr>
                    <td class="txt-center">${idx + 1}</td>
                    <td class="txt-bold">${namaClean}</td>
                    <td class="txt-center">${nh1 || '-'}</td>
                    <td class="txt-center">${nh2 || '-'}</td>
                    <td class="txt-center">${sts || '-'}</td>
                    <td class="txt-center">${sas || '-'}</td>
                    <td class="txt-center txt-bold" style="color:var(--accent-blue);">${avg}</td>
                </tr>`;
        });

        html += `</tbody></table></div>`;
        container.innerHTML = html;
    }

    // Load awal saat halaman dibuka
    loadRekapData();
</script>
</body>
</html>
