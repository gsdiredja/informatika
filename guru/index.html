<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduAdaptif - Portal Edukasi & Otomasi Akademik</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
    }
    .navbar-brand {
      font-weight: 700;
      font-size: 1.5rem;
    }
    .hero-section {
      padding: 100px 0 60px 0;
    }
    .badge-tag {
      background-color: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 50px;
      padding: 6px 16px;
      font-size: 0.875rem;
    }
    .btn-custom-primary {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      font-weight: 600;
      border-radius: 8px;
    }
    .btn-custom-primary:hover {
      background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark pt-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#">
        <img src="photo-guru.png" alt="Logo" width="36" height="36" class="rounded-circle" onerror="this.src='https://via.placeholder.com/36'">
        <span>EduAdaptif</span>
      </a>
      <div class="ms-auto">
        <!-- Mengarahkan ke Fungsi Cek Akses -->
        <button class="btn btn-primary rounded-pill px-4" onclick="keHalamanAkses()">
          <i class="bi bi-speedometer2 me-1"></i> Dashboard
        </button>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero-section text-center">
    <div class="container">
      <div class="mb-4">
        <span class="badge-tag">Portal Edukasi & Otomasi Akademik</span>
      </div>
      <h1 class="display-4 fw-bold text-white mb-4" style="max-width: 800px; margin: 0 auto;">
        Platform Kerja Pendidik & Administrasi Pembelajaran Adaptif
      </h1>
      <p class="lead text-secondary mb-5" style="max-width: 650px; margin: 0 auto;">
        EduAdaptif membantu guru mengelola presensi harian siswa, pengisian jurnal KBM terintegrasi, serta rekapitulasi penilaian secara real-time dan akurat.
      </p>
      <div>
        <!-- Mengarahkan ke Fungsi Cek Akses -->
        <button class="btn btn-custom-primary btn-lg" onclick="keHalamanAkses()">
          <i class="bi bi-code-square me-2"></i> Akses Ruang Kerja Pendidik
        </button>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function keHalamanAkses() {
      const userSession = localStorage.getItem("user_edu");
      
      if (userSession) {
        // Jika sudah login, langsung buka dashboard
        window.location.href = "dashboard.html";
      } else {
        // Jika belum login, buka halaman login
        window.location.href = "login.html"; 
      }
    }
  </script>
</body>
</html>
