<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduAdaptif - Portal Edukasi & Otomasi Akademik</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
    }
    .navbar-brand {
      font-weight: 700;
      font-size: 1.5rem;
    }
    .hero-section {
      padding: 100px 0 60px 0;
    }
    .badge-tag {
      background-color: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 50px;
      padding: 6px 16px;
      font-size: 0.875rem;
    }
    .btn-custom-primary {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      font-weight: 600;
      border-radius: 8px;
    }
    .btn-custom-primary:hover {
      background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
      color: #ffffff;
    }
    .modal-content {
      background-color: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
    }
    .form-control {
      background-color: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
    }
    .form-control:focus {
      background-color: #0f172a;
      border-color: #38bdf8;
      color: #f8fafc;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark pt-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#">
        <img src="photo-guru.png" alt="Logo" width="36" height="36" class="rounded-circle" onerror="this.src='https://via.placeholder.com/36'">
        <span>EduAdaptif</span>
      </a>
      <div class="ms-auto">
        <button class="btn btn-primary rounded-pill px-4" onclick="bukaModalLogin()">
          <i class="bi bi-speedometer2 me-1"></i> Dashboard
        </button>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero-section text-center">
    <div class="container">
      <div class="mb-4">
        <span class="badge-tag">Portal Edukasi & Otomasi Akademik</span>
      </div>
      <h1 class="display-4 fw-bold text-white mb-4" style="max-width: 800px; margin: 0 auto;">
        Platform Kerja Pendidik & Administrasi Pembelajaran Adaptif
      </h1>
      <p class="lead text-secondary mb-5" style="max-width: 650px; margin: 0 auto;">
        EduAdaptif membantu guru mengelola presensi harian siswa, pengisian jurnal KBM terintegrasi, serta rekapitulasi penilaian secara real-time dan akurat.
      </p>
      <div>
        <button class="btn btn-custom-primary btn-lg" onclick="bukaModalLogin()">
          <i class="bi bi-code-square me-2"></i> Akses Ruang Kerja Pendidik
        </button>
      </div>
    </div>
  </section>

  <!-- Modal Login -->
  <div class="modal fade" id="modalLogin" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content p-3">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold">Login Guru</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="alertBox" class="alert d-none" role="alert"></div>
          <form onsubmit="prosesLogin(event)">
            <div class="mb-3">
              <label class="form-label text-secondary">Username</label>
              <input type="text" id="username" class="form-control" placeholder="Masukkan username" required>
            </div>
            <div class="mb-3">
              <label class="form-label text-secondary">Password</label>
              <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
            </div>
            <button type="submit" id="btnLogin" class="btn btn-custom-primary w-100 mt-2">Masuk</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // ⚠️ PASTIKAN URL DEPLOYMENT APPS SCRIPT BERAKHIRAN /exec
    const API_URL_APP = "https://script.google.com/macros/s/AKfycby79vQf4Jomh_h3jd5KsVBcgxVDPhim2YeOWS4aKOqGG-pBI-yX0u1ZwxOTYJWhg9dO/exec"; 

    const modalLogin = new bootstrap.Modal(document.getElementById('modalLogin'));

    function bukaModalLogin() {
      // Jika sudah ada sesi login, langsung pindah ke dashboard
      const userSession = localStorage.getItem("user_edu");
      if (userSession) {
        window.location.href = "dashboard.html";
      } else {
        modalLogin.show();
      }
    }

    function prosesLogin(e) {
      e.preventDefault();
      
      const usernameInput = document.getElementById("username").value.trim();
      const passwordInput = document.getElementById("password").value.trim();
      const btnLogin = document.getElementById("btnLogin");
      const alertBox = document.getElementById("alertBox");

      btnLogin.disabled = true;
      btnLogin.innerText = "Memproses...";
      alertBox.classList.add("d-none");

      fetch(API_URL_APP, {
        method: "POST",
        body: JSON.stringify({
          action: "login",
          username: usernameInput,
          password: passwordInput
        })
      })
      .then(res => res.json())
      .then(res => {
        btnLogin.disabled = false;
        btnLogin.innerText = "Masuk";

        if (res.status === "success") {
          // 1. Simpan data user ke localStorage (key: user_edu)
          localStorage.setItem("user_edu", JSON.stringify(res.data));

          // 2. Set kelas & mapel aktif pertama kali
          if (res.data.ampu_kelas) {
            const listKelas = res.data.ampu_kelas.split(",");
            localStorage.setItem("activeKelas", listKelas[0].trim());
          }
          if (res.data.mapel) {
            localStorage.setItem("activeMapel", res.data.mapel.trim());
          }

          // 3. Arahkan ke dashboard
          window.location.href = "dashboard.html";
        } else {
          alertBox.className = "alert alert-danger";
          alertBox.innerText = res.message || "Username atau password salah!";
          alertBox.classList.remove("d-none");
        }
      })
      .catch(err => {
        btnLogin.disabled = false;
        btnLogin.innerText = "Masuk";
        alertBox.className = "alert alert-danger";
        alertBox.innerText = "Gagal terhubung ke server. Periksa koneksi atau URL Apps Script.";
        alertBox.classList.remove("d-none");
      });
    }
  </script>
</body>
</html>
