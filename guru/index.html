<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - EduAdaptif</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .card-login { max-width: 400px; margin: 80px auto; border-radius: 12px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card card-login shadow-sm p-4 bg-white">
      <h4 class="fw-bold text-center text-primary mb-3">EduAdaptif Login</h4>
      <p class="text-muted text-center small mb-4">Masukan akun guru Anda untuk melanjutkan</p>
      
      <!-- Box Notifikasi -->
      <div id="alert-box" class="alert d-none" role="alert"></div>

      <form onsubmit="prosesLogin(event)">
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Contoh: gurumatematika" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" id="btn-login" class="btn btn-primary w-100 fw-bold py-2">Masuk</button>
      </form>
    </div>
  </div>

  <script>
    // ⚠️ MASUKKAN URL WEB APP ANDA DI SINI (Harus berakhiran /exec)
    const API_URL_APP = "https://script.google.com/macros/s/AKfycby79vQf4Jomh_h3jd5KsVBcgxVDPhim2YeOWS4aKOqGG-pBI-yX0u1ZwxOTYJWhg9dO/exec";

    function showAlert(message, type) {
      const alertBox = document.getElementById("alert-box");
      alertBox.className = `alert alert-${type}`;
      alertBox.innerText = message;
      alertBox.classList.remove("d-none");
    }

    function prosesLogin(event) {
      // Mencegah form melakukan submit standar / reload halaman
      event.preventDefault(); 

      const usernameInput = document.getElementById("username").value.trim();
      const passwordInput = document.getElementById("password").value.trim();
      const btnLogin = document.getElementById("btn-login");

      btnLogin.disabled = true;
      btnLogin.innerText = "Memproses...";
      showAlert("Sedang memverifikasi akun...", "info");

      fetch(API_URL_APP, {
        method: "POST",
        body: JSON.stringify({
          action: "login",
          username: usernameInput,
          password: passwordInput
        })
      })
      .then(res => res.json())
      .then(res => {
        btnLogin.disabled = false;
        btnLogin.innerText = "Masuk";

        if (res.status === "success") {
          showAlert("Login Berhasil! Mengalihkan...", "success");
          
          // 1. Simpan data profil user ke LocalStorage
          localStorage.setItem("user_edu", JSON.stringify(res.data));

          // 2. Set kelas & mapel aktif pertama kali jika ada
          if (res.data.ampu_kelas) {
            const listKelas = res.data.ampu_kelas.split(",");
            localStorage.setItem("activeKelas", listKelas[0].trim());
          }
          if (res.data.mapel) {
            localStorage.setItem("activeMapel", res.data.mapel.trim());
          }

          // 3. Pindah ke halaman dashboard
          setTimeout(() => {
            window.location.href = "dashboard.html"; // Ubah jika nama file dashboard Anda berbeda
          }, 800);

        } else {
          showAlert("Gagal: " + res.message, "danger");
        }
      })
      .catch(err => {
        btnLogin.disabled = false;
        btnLogin.innerText = "Masuk";
        showAlert("Error Koneksi/Server: " + err, "danger");
      });
    }
  </script>
</body>
</html>
