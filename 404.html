<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Halaman Tidak Ditemukan | Kodi EduAdaptif</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #0f172a; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* HEADER NAVIGASI */
        header { padding: 16px 8%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; }
        .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 20px; color: #ffffff; text-decoration: none; }
        .brand img { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; }
        
        /* HEROCARD 404 */
        .error-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 30px 20px; max-width: 600px; margin: 0 auto; }
        
        /* STYLING GAMBAR ANIMASI UKURAN KECIL */
        .illustration-wrapper {
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
        }

        .img-404-anim {
            width: 100%;
            max-width: 250px; /* Ukuran gambar kecil & proporsional */
            height: auto;
            border-radius: 12px;
            box-shadow: 0 6px 18px -4px rgba(2, 132, 199, 0.25);
            border: 2px solid #1e293b;
        }

        .badge-404 { 
            font-size: 72px; 
            font-weight: 800; 
            line-height: 1; 
            background: linear-gradient(135deg, #38bdf8, #0284c7); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            margin-bottom: 8px;
            letter-spacing: -2px;
        }

        h1 { font-size: 24px; font-weight: 800; margin-bottom: 10px; color: #f8fafc; }
        p.desc { font-size: 14px; color: #94a3b8; line-height: 1.6; margin-bottom: 24px; }

        /* TOMBOL NAVIGASI */
        .btn-group { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        
        .btn-home { 
            background: #0284c7; 
            color: white; 
            padding: 10px 20px; 
            border-radius: 8px; 
            text-decoration: none; 
            font-weight: 700; 
            font-size: 14px; 
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); 
            transition: all 0.2s; 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
        }
        .btn-home:hover { background: #0369a1; transform: translateY(-2px); }

        .btn-back { 
            background: #1e293b; 
            color: #cbd5e1; 
            border: 1px solid #334155;
            padding: 10px 20px; 
            border-radius: 8px; 
            text-decoration: none; 
            font-weight: 700; 
            font-size: 14px; 
            transition: all 0.2s; 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
        }
        .btn-back:hover { background: #334155; color: #fff; }

        /* FOOTER HALAMAN */
        footer { 
            text-align: center; 
            padding: 16px; 
            font-size: 13px; 
            color: #64748b; 
            border-top: 1px solid #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        footer a { color: #38bdf8; text-decoration: none; font-weight: 600; }
        footer a:hover { text-decoration: underline; }

        @media (max-width: 600px) {
            .img-404-anim { max-width: 130px; }
            .badge-404 { font-size: 56px; }
            h1 { font-size: 20px; }
            p.desc { font-size: 13px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="brand">
            <img src="logo.png" alt="Logo Kodi" onerror="this.src='https://ui-avatars.com/api/?name=Kodi&background=0284c7&color=fff'">
            <span style="text-transform: none !important;">Kodi EduAdaptif</span>
        </a>
    </header>

    <main class="error-container">
        <!-- GAMBAR ANIMASI 404 DENGAN UKURAN KECIL -->
        <div class="illustration-wrapper">
            <img src="https://cdn.dribbble.com/users/285475/screenshots/2083086/dribbble_1.gif" alt="Animasi 404" class="img-404-anim">
        </div>

        <div class="badge-404">404</div>
        <h1>Halaman Tidak Ditemukan</h1>
        <p class="desc">
            Mohon maaf, halaman atau berkas yang Anda cari belum tersedia, telah dipindahkan, atau alamat URL yang Anda masukkan salah.
        </p>
        
        <div class="btn-group">
            <a href="https://www.kodi.web.id" class="btn-home">
                <i class="fas fa-house"></i> Ke Halaman Utama
            </a>
            <a href="javascript:history.back()" class="btn-back">
                <i class="fas fa-arrow-left"></i> Kembali
            </a>
        </div>
    </main>

    <footer>
        <span>&copy; 2026 <strong>Kodi EduAdaptif</strong> | kodi.web.id</span>
        <span>|</span>
        <a href="aboutme.html"> Development</a>
    </footer>

</body>
</html>
