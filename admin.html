<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Kontrol Akses Modul</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #f3f4f6; padding: 30px 20px; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { color: #1e293b; font-size: 20px; margin-bottom: 6px; }
        p.desc { font-size: 13px; color: #64748b; margin-bottom: 24px; }
        .topik-group { margin-bottom: 24px; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; }
        .topik-header { background: #0f172a; color: white; padding: 12px 16px; font-weight: 700; font-size: 14px; }
        .control-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #f1f5f9; background: #fff; }
        .control-row:last-child { border-bottom: none; }
        .modul-title { font-size: 13px; font-weight: 600; color: #334155; }
        .btn-group { display: flex; gap: 8px; }
        .btn { padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s; }
        .btn-open { background-color: #10b981; color: white; }
        .btn-open:hover { background-color: #059669; }
        .btn-close { background-color: #ef4444; color: white; }
        .btn-close:hover { background-color: #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <h2>🛠️ Panel Kontrol Akses Modul (Admin)</h2>
    <p class="desc">Atur izin akses topik dan modul untuk siswa secara real-time:</p>

    <!-- Container Kontrol Otomatis -->
    <div id="adminControlWrapper">
        <em>Memuat daftar modul...</em>
    </div>
</div>

<!-- Mengambil Data Topik & Modul Secara Otomatis -->
<script src="data-topik.js"></script>
<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwH3IGe7wra6vC4SyqHxV8h7rr7T4mztd4ZzaFsFkljzvN_090QEngLjXz2RBeDmaTA/exec";

    // Fungsi Render Otomatis Berdasarkan data-topik.js
    function renderAdminPanelOtomatis() {
        const wrapper = document.getElementById('adminControlWrapper');
        wrapper.innerHTML = "";

        if (typeof DATA_TOPIK === 'undefined') {
            wrapper.innerHTML = "<span style='color:red;'>Gagal memuat file data-topik.js!</span>";
            return;
        }

        // Looping Otomatis Semua Topik
        Object.keys(DATA_TOPIK).forEach(topikId => {
            const topik = DATA_TOPIK[topikId];
            
            let htmlGroup = `
                <div class="topik-group">
                    <div class="topik-header">TOPIK ${topikId}: ${topik.judulTopik}</div>
            `;

            // Looping Otomatis Semua Modul di Dalam Topik Tersebut
            Object.keys(topik.modul).forEach(modulId => {
                const modul = topik.modul[modulId];
                const keyAkses = `modul_${topikId}_${modulId}`;

                htmlGroup += `
                    <div class="control-row">
                        <div class="modul-title">${modul.title}</div>
                        <div class="btn-group">
                            <button class="btn btn-open" onclick="kirimPerintahAdmin('${keyAkses}', 'OPEN')">Buka Akses</button>
                            <button class="btn btn-close" onclick="kirimPerintahAdmin('${keyAkses}', 'CLOSED')">Tutup Akses</button>
                        </div>
                    </div>
                `;
            });

            htmlGroup += `</div>`;
            wrapper.innerHTML += htmlGroup;
        });
    }

    function kirimPerintahAdmin(keyAkses, status) {
        const params = new URLSearchParams();
        params.append('action', 'updateAksesAdmin');
        params.append('keyAkses', keyAkses);
        params.append('statusBaru', status);

        fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: params.toString()
        })
        .then(() => alert(`Berhasil! Status ${keyAkses} diubah menjadi: ${status}`))
        .catch(err => alert("Gagal memperbarui status akses di server."));
    }

    // Jalankan render saat halaman siap
    document.addEventListener("DOMContentLoaded", renderAdminPanelOtomatis);
</script>

</body>
</html>
